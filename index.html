
<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mijn Quran</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #f4f5ef;
  color: #193b30;
  font-family: Arial, sans-serif;
}

header {
  background: #173d31;
  color: white;
  padding: 28px 16px;
  text-align: center;
}

header h1 { margin: 0 0 8px; }
header p { margin-bottom: 0; }

main {
  max-width: 650px;
  margin: auto;
  padding: 16px;
}

.card {
  background: white;
  padding: 18px;
  border-radius: 14px;
  margin-bottom: 16px;
  box-shadow: 0 2px 8px #0000000b;
}

h2 { font-size: 20px; margin-top: 0; }

label {
  display: block;
  margin-top: 10px;
  font-size: 14px;
}

input, select, button {
  width: 100%;
  padding: 12px;
  margin: 6px 0;
  border-radius: 8px;
  font-size: 15px;
}

input, select {
  border: 1px solid #cbd5cc;
  background: white;
  color: #193b30;
}

button {
  border: none;
  background: #245b47;
  color: white;
  cursor: pointer;
}

button.secondary {
  background: #e8eee8;
  color: #193b30;
}

button.danger {
  background: #f8e8e5;
  color: #8a3027;
}

.track {
  padding: 14px 0;
  border-bottom: 1px solid #e5e9e4;
  overflow-wrap: anywhere;
}

.track:last-child { border-bottom: none; }

.track strong {
  display: block;
  margin-bottom: 8px;
  font-size: 16px;
}

audio {
  width: 100%;
  margin: 8px 0;
}

small { color: #64756b; }

#status {
  padding: 10px;
  border-radius: 8px;
  background: #e8eee8;
  margin-bottom: 12px;
  font-size: 13px;
  overflow-wrap: anywhere;
}

.hidden { display: none; }
</style>
</head>

<body>

<header>
  <h1>مكتبتي القرآنية</h1>
  <h1>Mijn Quran</h1>
  <p>Jouw persoonlijke Quran-bibliotheek</p>
</header>

<main>

  <div id="status" role="status">
    Je bibliotheek wordt geladen...
  </div>

  <section class="card">
    <h2>＋ Recitatie toevoegen</h2>

    <form id="addForm">
      <label for="trackName">Naam van de recitatie</label>
      <input id="trackName"
        placeholder="Bijv. Ahmed Talib Hameed — Al-Baqarah"
        required maxlength="150">

      <label for="trackUrl">Directe audiolink</label>
      <input id="trackUrl" type="url"
        placeholder="https://voorbeeld.nl/recitatie.mp3"
        required>

      <button type="submit">Recitatie opslaan</button>
    </form>

    <small>
      Gebruik een directe link naar een afspeelbaar audiobestand.
      Een gewone YouTube-link werkt hier niet.
    </small>
  </section>

  <section class="card">
    <h2>♡ Mijn afspeellijsten</h2>

    <form id="playlistForm">
      <label for="playlistName">Nieuwe afspeellijst</label>
      <input id="playlistName"
        placeholder="Bijv. Voor het slapen"
        maxlength="100" required>
      <button type="submit">Afspeellijst maken</button>
    </form>

    <label for="playlistFilter">Bekijk bibliotheek of afspeellijst</label>
    <select id="playlistFilter">
      <option value="all">Alle recitaties</option>
      <option value="favorites">Mijn favorieten</option>
    </select>

    <div id="playlistButtons"></div>
  </section>

  <section class="card">
    <h2>Mijn bibliotheek</h2>
    <input id="search" placeholder="Zoek op naam...">
    <div id="tracks"></div>
  </section>

</main>

<script>
"use strict";

const STORAGE_KEY = "mijn-quran-library-v2";

let tracks = [];
let playlists = [];
let activePlaylist = "all";
let storageAvailable = true;

const $ = id => document.getElementById(id);

function setStatus(message) {
  $("status").textContent = message;
}

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);

    if (raw) {
      const data = JSON.parse(raw);

      tracks = Array.isArray(data.tracks) ? data.tracks : [];
      playlists = Array.isArray(data.playlists)
        ? data.playlists : [];
    }

    storageAvailable = true;
  } catch (error) {
    storageAvailable = false;
    tracks = [];
    playlists = [];
    setStatus(
      "Opslag kon niet worden gelezen. Je gegevens zijn mogelijk " +
      "niet beschikbaar in deze browsercontext. " + error.message
    );
  }
}

function saveData() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      tracks,
      playlists
    }));

    storageAvailable = true;
    setStatus(
      "Opgeslagen. Je bibliotheek bevat " +
      tracks.length + " recitaties en " +
      playlists.length + " afspeellijsten."
    );

    return true;
  } catch (error) {
    storageAvailable = false;
    setStatus(
      "Opslaan is mislukt. Maak eerst een back-up van je gegevens. " +
      "Fout: " + error.message
    );
    return false;
  }
}

function makeId() {
  return Date.now().toString(36) +
    Math.random().toString(36).slice(2, 9);
}

function createButton(label, className, action) {
  const button = document.createElement("button");
  button.type = "button";
  button.textContent = label;

  if (className) button.className = className;

  button.addEventListener("click", action);
  return button;
}

function renderPlaylistButtons() {
  const container = $("playlistButtons");
  container.replaceChildren();

  playlists.forEach(playlist => {
    const row = document.createElement("div");

    row.appendChild(createButton(
      "♫ " + playlist.name +
      " (" + playlist.trackIds.length + ")",
      "secondary",
      () => {
        activePlaylist = playlist.id;
        render();
      }
    ));

    row.appendChild(createButton(
      "Verwijder afspeellijst",
      "danger",
      () => {
        if (!confirm(
          "Deze afspeellijst verwijderen? De recitaties blijven bewaard."
        )) return;

        playlists = playlists.filter(p => p.id !== playlist.id);

        if (activePlaylist === playlist.id) {
          activePlaylist = "all";
        }

        saveData();
        render();
      }
    ));

    container.appendChild(row);
  });
}

function render() {
  renderPlaylistButtons();

  const container = $("tracks");
  container.replaceChildren();

  const query = $("search").value.trim().toLowerCase();
  const filter = $("playlistFilter").value;

  let shown = tracks.filter(track =>
    track.name.toLowerCase().includes(query)
  );

  if (filter === "favorites") {
    shown = shown.filter(track => track.favorite);
  }

  if (activePlaylist !== "all") {
    const playlist = playlists.find(p => p.id === activePlaylist);

    if (playlist) {
      shown = shown.filter(track =>
        playlist.trackIds.includes(track.id)
      );
    } else {
      activePlaylist = "all";
    }
  }

  if (shown.length === 0) {
    container.textContent =
      "Geen recitaties gevonden. Voeg hierboven een recitatie toe.";
    return;
  }

  shown.forEach(track => {
    const item = document.createElement("div");
    item.className = "track";

    const title = document.createElement("strong");
    title.textContent = track.name;
    item.appendChild(title);

    const audio = document.createElement("audio");
    audio.controls = true;
    audio.preload = "none";
    audio.src = track.url;

    audio.addEventListener("error", () => {
      const message = item.querySelector(".audioError");
      if (message) {
        message.textContent =
          "Audio kon niet worden geladen. Controleer de link.";
      }
    });

    item.appendChild(audio);

    const error = document.createElement("small");
    error.className = "audioError";
    item.appendChild(error);

    item.appendChild(createButton(
      track.favorite ? "♥ Favoriet" : "♡ Favoriet",
      "secondary",
      () => {
        track.favorite = !track.favorite;
        saveData();
        render();
      }
    ));

    if (playlists.length > 0) {
      const selector = document.createElement("select");
      selector.setAttribute("aria-label", "Kies afspeellijst");

      const placeholder = document.createElement("option");
      placeholder.value = "";
      placeholder.textContent = "Kies afspeellijst";
      selector.appendChild(placeholder);

      playlists.forEach(playlist => {
        const option = document.createElement("option");
        option.value = playlist.id;
        option.textContent = playlist.name;
        selector.appendChild(option);
      });

      item.appendChild(selector);

      item.appendChild(createButton(
        "Toevoegen aan afspeellijst",
        "secondary",
        () => {
          const playlist = playlists.find(
            p => p.id === selector.value
          );

          if (!playlist) {
            alert("Kies eerst een afspeellijst.");
            return;
          }

          if (!playlist.trackIds.includes(track.id)) {
            playlist.trackIds.push(track.id);
            saveData();
            render();
          } else {
            alert("Deze recitatie staat al in de afspeellijst.");
          }
        }
      ));
    }

    item.appendChild(createButton(
      "Verwijderen",
      "danger",
      () => {
        if (!confirm("Deze recitatie verwijderen?")) return;

        tracks = tracks.filter(t => t.id !== track.id);

        playlists.forEach(playlist => {
          playlist.trackIds = playlist.trackIds.filter(
            id => id !== track.id
          );
        });

        saveData();
        render();
      }
    ));

    container.appendChild(item);
  });
}

$("addForm").addEventListener("submit", event => {
  event.preventDefault();

  const name = $("trackName").value.trim();
  const url = $("trackUrl").value.trim();

  let parsed;

  try {
    parsed = new URL(url);
  } catch {
    alert("Vul een geldige audiolink in.");
    return;
  }

  if (!["https:", "http:"].includes(parsed.protocol)) {
    alert("Gebruik een http- of https-link.");
    return;
  }

  tracks.unshift({
    id: makeId(),
    name,
    url,
    favorite: false
  });

  if (!saveData()) {
    tracks.shift();
    return;
  }

  $("addForm").reset();
  render();
});

$("playlistForm").addEventListener("submit", event => {
  event.preventDefault();

  const name = $("playlistName").value.trim();

  if (!name) return;

  playlists.push({
    id: makeId(),
    name,
    trackIds: []
  });

  if (!saveData()) {
    playlists.pop();
    return;
  }

  $("playlistForm").reset();
  render();
});

$("search").addEventListener("input", render);
$("playlistFilter").addEventListener("change", render);

loadData();
render();

if (storageAvailable) {
  setStatus(
    "Bibliotheek geladen. " + tracks.length +
    " recitaties en " + playlists.length + " afspeellijsten."
  );
}
</script>
</body>
</html>
